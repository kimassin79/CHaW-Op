seed: 1701
seeds: [1701, 2718, 3141, 4099, 5279, 6211, 7103, 8089, 9001, 10007]
data:
  root: data/aaa_hemonet
  manifest: manifests/cohort.csv
  calibration_fraction: 0.15
  nodes_per_mesh: 65536
  fields: [pressure, velocity, wss, tawss, osi, ecap, ilt, pws, rpi]
model:
  width: 256
  operator_layers: 6
  attention_heads: 8
  coupling_layers: 3
  ga_channels: 32
  radii: [0.015, 0.03, 0.06, 0.12]
  quantiles: [0.05, 0.5, 0.95]
optimization:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.00001
  batch_size_per_rank: 4
  epochs: 300
  gradient_accumulation: 8
  gradient_clip_norm: 1.0
  precision: fp32
  scheduler: cosine
  warmup_epochs: 50
  residual_ramp_start: 50
  residual_ramp_end: 200
  residual_max_weight: 0.1
  quantile_weight: 0.05
distributed:
  world_size: 32
  backend: nccl
  find_unused_parameters: false
runtime:
  workers_per_rank: 16
  prefetch_factor: 8
  persistent_workers: true
  epochs_between_snapshots: 25
