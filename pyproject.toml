[build-system]
requires = ["setuptools==65.6.3", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "chaw-op"
version = "0.1.0"
requires-python = "==3.9.*"
dependencies = [
  "torch==1.13.1",
  "torch-geometric==2.2.0",
  "numpy==1.23.5",
  "scipy==1.9.3",
  "scikit-learn==1.1.3",
  "h5py==3.7.0",
  "omegaconf==2.2.3",
  "hydra-core==1.2.0"
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
